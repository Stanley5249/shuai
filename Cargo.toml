[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Stanley5249/shuai"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cpsat = { git = "https://github.com/Stanley5249/cpsat" }
shuai-client = { path = "./crates/shuai-client", version = "0.1.0" }

# Socket.IO client
sioc = "0.5"

# Async runtime
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
url = "2"

# Serialization
bytestring = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
miette = { version = "7", default-features = false, features = ["derive"] }
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
fastrand = "2"

[workspace.lints.clippy]
assertions_on_result_states = "warn"
pedantic = "warn"
